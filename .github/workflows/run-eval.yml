# Run an armlab sim eval on Modal from the GitHub UI (or `gh workflow run run-eval.yml -f policy=oracle`).
# The runner holds only MODAL_TOKEN_ID / MODAL_TOKEN_SECRET (repo secrets); model keys stay in the Modal
# secret `armlab-llm`. Results land on the `armlab-runs` volume (served by the armlab-results Modal app) and
# are attached to this workflow run as an artifact.
name: run-eval

on:
  workflow_dispatch:
    inputs:
      policy:
        description: "Policy (oracle and system1 call no model)"
        type: choice
        options: [oracle, system1, direct, hybrid]
        default: oracle
      vlm:
        description: "VLM spec for direct/hybrid, e.g. anthropic:claude-opus-5-5:medium or openai:<model-id>"
        type: string
        default: "anthropic:claude-opus-5-5:medium"
      tasks:
        description: "Comma-separated tasks or 'all' (blocks_into_bin, stack_in_order, larger_into_bin, sort_warm_cool, conveyor_pick)"
        type: string
        default: all
      seeds:
        description: "Seeds, e.g. 0 or 0-4 or 0,2,5"
        type: string
        default: "0"
      clock:
        description: "paused freezes the world while the model thinks; realtime does not"
        type: choice
        options: [paused, realtime]
        default: paused
      video:
        description: "Record episode videos (playable on the results page)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: run-eval-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: robotics
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # Inputs go through env vars, never straight into shell text.
      POLICY: ${{ inputs.policy }}
      VLM: ${{ inputs.vlm }}
      TASKS: ${{ inputs.tasks }}
      SEEDS: ${{ inputs.seeds }}
      CLOCK: ${{ inputs.clock }}
      VIDEO: ${{ inputs.video }}
      RUN_NAME: gh-${{ github.run_id }}-${{ inputs.policy }}
      MUJOCO_GL: osmesa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: robotics/pyproject.toml

      - name: Validate inputs
        run: |
          [[ "$SEEDS" =~ ^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$ ]] || { echo "::error::bad seeds '$SEEDS'"; exit 1; }
          [[ "$TASKS" =~ ^[a-z_,]+$ ]] || { echo "::error::bad tasks '$TASKS'"; exit 1; }
          [[ "$VLM" =~ ^[A-Za-z0-9:._/@+-]+$ ]] || { echo "::error::bad vlm '$VLM'"; exit 1; }
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Add MODAL_TOKEN_ID and MODAL_TOKEN_SECRET as repository secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libosmesa6
          python -m pip install -q -e ".[cloud]"

      - name: Doctor (no secret values are printed)
        run: armlab-doctor

      - name: Run eval on Modal
        run: |
          video_flag=--no-video
          [ "$VIDEO" = "true" ] && video_flag="--video --download"
          # shellcheck disable=SC2086
          modal run modal_apps/armlab_eval.py --policy "$POLICY" --vlm "$VLM" --tasks "$TASKS" \
            --seeds "$SEEDS" --clock "$CLOCK" --run "$RUN_NAME" $video_flag 2>&1 | tee "$RUNNER_TEMP/eval.log"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## armlab eval \`$RUN_NAME\`"
            echo
            echo "policy \`$POLICY\` · vlm \`$VLM\` · tasks \`$TASKS\` · seeds \`$SEEDS\` · clock \`$CLOCK\` · video \`$VIDEO\`"
            echo
            if [ -f "runs/$RUN_NAME/summary.txt" ]; then
              echo '```'; cat "runs/$RUN_NAME/summary.txt"; echo '```'
            else
              echo "No summary was written; see the job log."
            fi
            if [ -f "runs/$RUN_NAME/results_url.txt" ]; then
              echo; echo "Results page (videos): $(cat "runs/$RUN_NAME/results_url.txt")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RUN_NAME }}
          path: robotics/runs/${{ env.RUN_NAME }}
          if-no-files-found: warn
          retention-days: 30
